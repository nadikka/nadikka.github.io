<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Cibernética del símbolo · Módulo 2 — atlas navegable (v4)</title>
<style>
/* ============ tema (CE: negro default, toggle crema) ============ */
:root{
  --fondo:#0B0B0A; --tinta:#ECEAE3; --tinta-suave:rgba(236,234,227,.55);
  --tinta-tenue:rgba(236,234,227,.28); --oxido:#B8412C;
  --panel:#141412; --borde:rgba(236,234,227,.25);
}
body.claro{
  --fondo:#F5F2EA; --tinta:#1A1A18; --tinta-suave:rgba(26,26,24,.6);
  --tinta-tenue:rgba(26,26,24,.3); --panel:#EDEAE0; --borde:rgba(26,26,24,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--fondo);color:var(--tinta);
  font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif}
/* ============ chrome fijo ============ */
#cabecera{position:fixed;top:0;left:0;right:0;height:52px;z-index:60;display:flex;align-items:center;
  gap:18px;padding:0 16px;background:var(--fondo);border-bottom:1px solid var(--borde)}
#cabecera h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
#cabecera h2{font-size:12px;margin:0;font-weight:400;color:var(--tinta-suave);white-space:nowrap}
#menu{margin-left:auto;display:flex;gap:6px;align-items:center}
#menu button, #tema-btn{background:none;border:1px solid var(--borde);color:var(--tinta);
  font:600 11px "IBM Plex Sans Condensed",sans-serif;padding:5px 10px;cursor:pointer;letter-spacing:.5px}
#menu button:hover,#tema-btn:hover{background:var(--tinta);color:var(--fondo)}
#buscar{background:none;border:1px solid var(--borde);color:var(--tinta);padding:5px 8px;
  font:400 12px "IBM Plex Sans Condensed",sans-serif;width:170px}
/* barra de temáticas (como #map-topics de CE) */
#temas-linea{position:fixed;top:52px;left:44px;right:0;height:26px;z-index:50;overflow:hidden;
  background:var(--fondo);border-bottom:1px solid var(--borde)}
#temas-linea .tema-lbl{position:absolute;top:4px;font-size:12.5px;font-weight:600;white-space:nowrap;
  border-left:1px solid var(--tinta-suave);padding-left:7px;overflow:hidden;text-overflow:ellipsis}
/* eje de años (izquierda, como #map-periods de CE) */
#eje-anios{position:fixed;top:78px;left:0;width:44px;bottom:34px;z-index:50;background:var(--fondo)}
#eje-anios .anio{position:absolute;right:6px;font:700 16px "IBM Plex Mono",monospace;color:var(--tinta-suave)}
/* footer */
#pie{position:fixed;bottom:0;left:0;right:0;height:34px;z-index:60;display:flex;align-items:center;
  gap:16px;padding:0 14px;background:var(--fondo);border-top:1px solid var(--borde);
  font:400 10.5px "IBM Plex Mono",monospace;color:var(--tinta-suave)}
#zoom-btns{display:flex;gap:4px}
#zoom-btns button{width:24px;height:22px;background:none;border:1px solid var(--borde);color:var(--tinta);
  font-size:13px;line-height:1;cursor:pointer}
#creditos{margin-left:auto;font-size:10px}
/* ============ lienzo ============ */
#lienzo{position:fixed;top:78px;left:44px;right:0;bottom:34px;cursor:grab}
#lienzo:active{cursor:grabbing}
svg{display:block;width:100%;height:100%}
/* ============ mundo ============ */
.sep-columna{stroke:var(--tinta-tenue);stroke-width:1;stroke-dasharray:2 6;vector-effect:non-scaling-stroke}
.linea-periodo{stroke:var(--tinta-tenue);stroke-width:1;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.titulo-columna{font:700 58px "IBM Plex Sans Condensed",sans-serif;fill:var(--tinta)}
.sub-columna{font:italic 400 22px "IBM Plex Sans Condensed",sans-serif;fill:var(--tinta-suave)}
/* nodos */
.nodo{cursor:pointer}
.nodo .glifo{color:var(--tinta)}
/* bloque de nodo: ícono a la izquierda, dashboard (título+meta+resumen) al costado */
.nodo .n-titulo{fill:var(--tinta);font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700}
.nodo.peso3 .n-titulo{font-size:40px}
.nodo.peso2 .n-titulo{font-size:26px}
.nodo.peso1 .n-titulo{font-size:19px}
.nodo .n-anio{font:700 17px "IBM Plex Mono",monospace;fill:var(--tinta);letter-spacing:.3px}
.nodo .n-res{font:400 15px "IBM Plex Sans Condensed",sans-serif;fill:var(--tinta);fill-opacity:.72}
.nodo .n-diagrama{color:var(--tinta-suave)}
.nodo .n-regla{stroke:var(--tinta);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
/* óxido reservado a los nodos clave de la tesis (liberación↔control) */
.nodo.clave .n-titulo{fill:var(--oxido)}
.nodo.clave .n-regla{stroke:var(--oxido);opacity:.75}
.nodo.clave .glifo{color:var(--oxido)}
/* aristas (neutras, sin rojo; ocultas salvo ego-red) */
.arista{fill:none;stroke:var(--tinta-suave);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0}
.arista.puente{stroke-dasharray:6 5}
.arista-lbl{font:italic 400 13px "IBM Plex Sans Condensed",sans-serif;fill:var(--tinta-suave);opacity:0}
/* focus / ego-red */
body.enfocado .nodo{opacity:.12}
body.enfocado .nodo.ego{opacity:1}
body.enfocado .arista{opacity:0}
body.enfocado .arista.ego{opacity:.85}
body.enfocado .arista-lbl.ego{opacity:.9}
/* panel lateral */
#panel{position:fixed;top:78px;right:-380px;width:360px;bottom:34px;z-index:70;background:var(--panel);
  border-left:1px solid var(--borde);padding:20px;overflow-y:auto;transition:right .25s ease}
#panel.abierto{right:0}
#panel .p-numero{font:400 11px "IBM Plex Mono",monospace;color:var(--tinta-suave)}
#panel h3{font-size:22px;margin:6px 0 2px;font-weight:700}
#panel .p-meta{font:400 11px "IBM Plex Mono",monospace;color:var(--tinta-suave);margin-bottom:12px}
#panel .p-resumen{font-size:14px;line-height:1.55}
#panel .p-conexiones{margin-top:16px;border-top:1px solid var(--borde);padding-top:10px}
#panel .p-conexiones h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tinta-suave);margin:0 0 8px}
#panel .p-con{display:block;background:none;border:none;color:var(--tinta);text-align:left;cursor:pointer;
  font:400 12.5px "IBM Plex Sans Condensed",sans-serif;padding:4px 0;width:100%}
#panel .p-con:hover{color:var(--oxido)}
#panel .p-con .rel{font-style:italic;color:var(--tinta-suave)}
#panel .cerrar{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--tinta);
  font-size:18px;cursor:pointer}
@media (prefers-reduced-motion: reduce){ #panel{transition:none} }
</style>
</head>

<!--

  Spec: HANDOFF-FABLE-CALCULATING-EMPIRES.md §5.3 + CE-VISUAL-SPEC.md §2.
  - 53 <symbol> reusables, viewBox uniforme "0 0 100 100".
  - Trazo currentColor, fill:none (relleno mínimo solo en dots/marcas puntuales).
  - stroke-width="4" en unidades de viewBox ≈ 1.5–2px en pantalla a tamaños de render
    típicos (24–48px). Si se necesita trazo constante al zoomear, aplicar
    vector-effect:non-scaling-stroke desde CSS del consumidor.
  - Uso: servir inline (display:none en el contenedor) y referenciar con
    <use href="#icono-X" width="..." height="..."/>. El color sale de currentColor.
  - Cero gradientes, cero sombras. Estilo grabado/técnico simple (el detalle bespoke
    de los nodos héroe es Nivel B, NO vive acá).
-->

/* ============ 1 · escala temporal vertical (CE: viejo abajo, nuevo arriba) ============ */
/* periodos top→bottom: [añoMax, añoMin, altoPx] — presente expandido, pasado comprimido */
const PERIODOS = [
  [2026, 2015, 720],
  [2015, 2000, 600],
  [2000, 1980, 440],
  [1980, 1960, 620],
  [1960, 1940, 440],
  [1940, 1900, 260],
  [1900, 1830, 160],
  [1830, 1600, 150],
];
const Y0 = 200; // margen superior del mundo
function añoY(a){
  let acc = Y0;
  for (const [hi, lo, h] of PERIODOS){
    if (a > hi) return acc;                    // más nuevo que el techo
    if (a >= lo) return acc + (hi - a) / (hi - lo) * h;
    acc += h;
  }
  return acc;
}
/* ALTO_MUNDO se recalcula después del layout real (ver más abajo) — el estimado por PERIODOS
   no contempla que el anti-colisión empuja nodos más abajo en zonas densas. Placeholder acá
   solo por si algo lo referencia antes de tiempo (no debería). */
let ALTO_MUNDO = Y0 + PERIODOS.reduce((s,p)=>s+p[2],0) + 160;

/* ============ 2 · columnas (CE: temáticas verticales con separador punteado) ============ */
const COL_W = 1022, COL_GAP = 170, COL_X0 = 80;
const COLUMNAS = [
  { id:'C1', titulo:'Cibernética y Cybersyn',        sub:'del cálculo a la máquina de gobernar' },
  { id:'C2', titulo:'La red: de ARPANET a Lavender', sub:'la infraestructura de doble uso' },
  { id:'C3', titulo:'La manufactura del consenso',   sub:'de Bernays a la guerra cognitiva' },
  { id:'C4', titulo:'Capitalismo de vigilancia',     sub:'la sombra que Wiener anticipó' },
].map((c,i)=>({ ...c, x0: COL_X0 + i*(COL_W+COL_GAP), w: COL_W }));
const ANCHO_MUNDO = COL_X0 + COLUMNAS.length*(COL_W+COL_GAP) + 40;

/* orden estable de bandas (sub-carriles) dentro de cada columna */
const ORDEN_BANDAS = ['genealogia','cibernetica','liberacion','control','consenso','sujeto','obra'];
const LANES = 2, LANE_W = 470, LANE_GAP = 30, LANE_PAD = 26; // 2 columnas internas de bloques

/* ============ 3 · layout ============ */
// Elena pertenece al juego, no a este atlas de historia → se excluye del lienzo (JSON intacto).
const nodos = DATA.nodos.filter(n => n.id !== 'elena').map(n => ({...n}));
const porId = new Map(nodos.map(n => [n.id, n]));

/* --- métricas de bloque por nodo (ícono grande + dashboard de texto completo al costado) --- */
function envolver(txt, maxCh){
  const palabras = (txt || '').split(/\s+/); const out = ['']; let i = 0;
  for (const p of palabras){
    if ((out[i] + ' ' + p).trim().length > maxCh && out[i]) { out.push(p); i++; }
    else out[i] = (out[i] ? out[i] + ' ' : '') + p;
  }
  return out.filter(Boolean);
}
const MET = {
  3: { icon: 152, titleSize: 36, titleLH: 38, titleWrap: 17, resWrap: 40 },
  2: { icon:  98, titleSize: 24, titleLH: 26, titleWrap: 26, resWrap: 42 },
  1: { icon:  68, titleSize: 19, titleLH: 21, titleWrap: 30, resWrap: 42 },
};
const RES_LH = 17, META_H = 22, HEAD_GAP = 12;
/* Piloto de "criterios geométricos" (columna C1): diagrama extra según el TIPO de contenido
   verificado del nodo — no es decoración libre, cada uno usa solo datos ya presentes en su
   resumen. Vive acá (no en m2-nodos.json) para no tocar el schema de datos. */
const EXTRA = {
  'c1-cybersyn': { simbolo: 'diagrama-cybersyn-4',    w: 220, h: 138 }, // hexágono+número: 4 componentes reales
  'c1-wiener':   { simbolo: 'diagrama-wiener-libro',  w: 280, h: 102 }, // tarjeta bibliográfica del libro fundacional
  'c1-macy':     { simbolo: 'diagrama-macy-converge', w: 240, h: 158 }, // convergencia de 4 disciplinas → 3 campos
};
for (const n of nodos){
  n._año = n.año ?? n.añoRef ?? n.layoutYear ?? 1990;
  n._col = COLUMNAS.find(c => c.id === n.clase) || COLUMNAS[0];
  const m = MET[n.peso] || MET[1];
  n._heroe = n.ilustracionBespoke && String(n.ilustracionBespoke).startsWith('heroe-') ? n.ilustracionBespoke : null;
  n._iconS = n._heroe ? m.icon + 18 : m.icon;
  n._titLines = envolver(n.titulo, m.titleWrap);
  n._resLines = envolver(n.resumen, m.resWrap);
  n._extra = EXTRA[n.id] || null;
  const headH = n._titLines.length * m.titleLH + HEAD_GAP + META_H;
  const textH = headH + n._resLines.length * RES_LH + (n._extra ? n._extra.h + 16 : 0);
  n._blockH = Math.max(n._iconS, textH) + 10;
  n._blockW = Math.max(
    m.icon + 18 + Math.max(...n._resLines.map(l => l.length), n.titulo.length) * (m.titleSize > 30 ? 7 : 7.2),
    n._extra ? m.icon + 18 + n._extra.w : 0
  );
}
/* sub-carriles por banda + anti-colisión vertical por altura real */
for (const col of COLUMNAS){
  const propios = nodos.filter(n => n._col === col);
  const bandas = [...new Set(propios.map(n => n.banda))]
    .sort((a,b) => ORDEN_BANDAS.indexOf(a) - ORDEN_BANDAS.indexOf(b));
  col._bandas = bandas;
  /* Partición CONTIGUA de bandas entre carriles (nunca se parte una banda, y las bandas que
     comparten carril son vecinas en ORDEN_BANDAS, no cualquiera por peso — evita mezclar temas
     lejanos solo para balancear cantidad). Partición lineal óptima para 2 carriles. */
  const conteos = bandas.map(b => propios.filter(p => p.banda === b).length);
  const total = conteos.reduce((s,c) => s+c, 0);
  const laneDe = {};
  { let acc = 0, lane = 0;
    for (let i = 0; i < bandas.length; i++){
      const restanCarriles = LANES - 1 - lane;
      const restanBandas = bandas.length - i;
      // cortar a nuevo carril si ya cargamos ~lo que corresponde a este carril y todavía
      // quedan bandas y carriles para repartir
      if (lane < LANES - 1 && restanBandas > restanCarriles && acc >= total * (lane+1) / LANES){
        lane++;
      }
      laneDe[bandas[i]] = lane;
      acc += conteos[i];
    }
  }
  for (const n of propios){
    n._lane = laneDe[n.banda] ?? 0;
    n._x = col.x0 + LANE_PAD + n._lane * (LANE_W + LANE_GAP) + (n.nudge?.dx || 0);
    n._y = añoY(n._año) + (n.nudge?.dy || 0);
  }
  for (let lane = 0; lane < LANES; lane++){
    const carril = propios.filter(n => n._lane === lane).sort((p,q) => p._y - q._y);
    const GAP = 34;
    for (let i = 1; i < carril.length; i++){
      const min = carril[i-1]._y + carril[i-1]._blockH + GAP;
      if (carril[i]._y < min) carril[i]._y = min;
    }
  }
}
/* alto real del mundo: el anti-colisión puede empujar nodos bien más abajo del estimado
   por PERIODOS en zonas densas — sin esto, zoom/pan quedan clampeados antes del contenido real
   (no se puede bajar del todo) y el fit inicial encuadra de más arriba (parece "sobrar" espacio). */
ALTO_MUNDO = Math.max(...nodos.map(n => n._y + n._blockH)) + 160;

/* ============ 4 · render ============ */
const svg = d3.select('#svg');
const mundo = d3.select('#mundo');

/* separadores de columna + títulos EN el lienzo (CE pone el título grande adentro) */
for (const col of COLUMNAS){
  if (col !== COLUMNAS[0]){
    mundo.append('line').attr('class','sep-columna')
      .attr('x1',col.x0-COL_GAP/2).attr('x2',col.x0-COL_GAP/2).attr('y1',60).attr('y2',ALTO_MUNDO-40);
  }
  mundo.append('text').attr('class','titulo-columna')
    .attr('x',col.x0+8).attr('y',120).text(col.titulo);
  mundo.append('text').attr('class','sub-columna')
    .attr('x',col.x0+10).attr('y',156).text(col.sub);
}
/* líneas de período + registro para el eje */
const marcasAño = [];
{ let acc = Y0;
  for (const [hi,lo,h] of PERIODOS){
    marcasAño.push({año:hi, y:acc});
    mundo.append('line').attr('class','linea-periodo')
      .attr('x1',60).attr('x2',ANCHO_MUNDO-40).attr('y1',acc).attr('y2',acc);
    acc += h;
  }
  marcasAño.push({año:PERIODOS.at(-1)[1], y:acc});
  mundo.append('line').attr('class','linea-periodo')
    .attr('x1',60).attr('x2',ANCHO_MUNDO-40).attr('y1',acc).attr('y2',acc);
}
const centro = n => [n._x + n._iconS/2, n._y + n._iconS/2];
/* Sin espina de linaje: CE resuelve la cadena cronológica por proximidad + carril compartido
   (misma columna X), no dibujando una línea por banda — con íconos grandes esa línea tapaba el
   glifo. El orden vertical + el carril ya comunican "esto sigue a esto". */
/* aristas (neutras; ocultas salvo ego-red — CE resuelve casi todo por proximidad/columna) */
const capaAristas = mundo.append('g');
const aristas = DATA.aristas.map(a => ({...a,
  _f: porId.get(a.from), _t: porId.get(a.to)})).filter(a => a._f && a._t);
for (const a of aristas){
  const [fx,fy] = centro(a._f), [tx,ty] = centro(a._t);
  const dx = tx - fx, dy = ty - fy;
  const path = `M${fx},${fy} C${fx + dx*.15},${fy + dy*.6} ${tx - dx*.15},${ty - dy*.6} ${tx},${ty}`;
  a._el = capaAristas.append('path')
    .attr('class', 'arista' + (a.tipo === 'puente' ? ' puente' : '')).attr('d', path);
  if (a.label){
    a._lbl = capaAristas.append('text').attr('class','arista-lbl')
      .attr('x',(fx+tx)/2).attr('y',(fy+ty)/2 - 6).attr('text-anchor','middle').text(a.label);
  }
}
/* nodos — bloque: ícono grande a la izquierda + dashboard (título/meta/resumen) al costado */
// óxido con avaricia: solo los anclas de la tesis liberación↔control
const CLAVE = new Set(['c1-cybersyn','c1-wiener','c4-wiener-tuercas']);
const capaNodos = mundo.append('g');
for (const n of nodos){
  const m = MET[n.peso] || MET[1];
  const g = capaNodos.append('g')
    .attr('class', `nodo peso${n.peso}` + (CLAVE.has(n.id) ? ' clave' : ''))
    .attr('transform', `translate(${n._x},${n._y})`).attr('data-id', n.id);
  /* ícono / héroe */
  g.append('use').attr('class','glifo')
    .attr('href', '#' + (n._heroe || ('icono-' + n.icono)))
    .attr('x', 0).attr('y', 0).attr('width', n._iconS).attr('height', n._iconS);
  /* columna de texto al costado */
  const tx = m.icon + 18;
  let y = m.titleSize * 0.82;
  n._titLines.forEach((l,i) =>
    g.append('text').attr('class','n-titulo').attr('x', tx).attr('y', y + i*m.titleLH).text(l));
  const headBase = n._titLines.length * m.titleLH;
  /* regla fina del ancho del título (como el filete de los hubs de CE) */
  const titW = Math.max(...n._titLines.map(l => l.length)) * m.titleSize * 0.52;
  g.append('line').attr('class','n-regla')
    .attr('x1', tx).attr('x2', tx + titW)
    .attr('y1', headBase + 4).attr('y2', headBase + 4);
  /* año con jerarquía tipográfica propia (número y tipo quedan solo en el panel lateral) */
  const anioTxt = `${n.año ?? 's/f'}` + (n.joya ? '  💎' : '');
  g.append('text').attr('class','n-anio').attr('x', tx).attr('y', headBase + META_H).text(anioTxt);
  /* resumen COMPLETO */
  const resY = headBase + META_H + HEAD_GAP + 8;
  n._resLines.forEach((l,i) =>
    g.append('text').attr('class','n-res').attr('x', tx).attr('y', resY + i*RES_LH).text(l));
  /* diagrama extra según el tipo de contenido (piloto de criterios geométricos, ver EXTRA arriba) */
  if (n._extra){
    const ey = resY + n._resLines.length * RES_LH + 16;
    g.append('use').attr('class','n-diagrama').attr('href', '#' + n._extra.simbolo)
      .attr('x', tx).attr('y', ey).attr('width', n._extra.w).attr('height', n._extra.h);
  }
  /* hit-area cubre el bloque entero */
  g.append('rect').attr('x',-6).attr('y',-6)
    .attr('width', n._blockW + 12).attr('height', n._blockH + 12).attr('fill','transparent');
  g.on('click', ev => { ev.stopPropagation(); enfocar(n); });
}

/* ============ 5 · zoom / navegación ============ */
const zoom = d3.zoom()
  .scaleExtent([0.12, 9])
  .translateExtent([[-300,-200],[ANCHO_MUNDO+300, ALTO_MUNDO+200]])
  .on('zoom', ev => {
    mundo.attr('transform', ev.transform);
    actualizarChrome(ev.transform);
  })
  .on('end', ev => {
    const t = ev.transform;
    history.replaceState(null,'', `#${t.x.toFixed(0)},${t.y.toFixed(0)},${t.k.toFixed(3)}`);
  });
svg.call(zoom).on('dblclick.zoom', null);
svg.on('click', () => { desenfocar(); cerrarPanel(); });

function actualizarChrome(t){
  document.body.dataset.zoom = t.k < 0.32 ? 'lejos' : t.k < 1.15 ? 'medio' : 'cerca';
  /* barra de temáticas: proyectar x de columnas */
  const cont = document.getElementById('temas-linea');
  cont.innerHTML = COLUMNAS.map(c => {
    const x = t.applyX(c.x0);
    const wpx = c.w * t.k;
    return `<div class="tema-lbl" style="left:${x}px;width:${wpx-8}px">${c.titulo}</div>`;
  }).join('');
  /* eje de años: proyectar y */
  const eje = document.getElementById('eje-anios');
  const alto = eje.getBoundingClientRect().height;
  eje.innerHTML = marcasAño.map(m => {
    const y = t.applyY(m.y) - 78;
    return (y > -10 && y < alto + 10) ? `<div class="anio" style="top:${y-6}px">${m.año}</div>` : '';
  }).join('');
}

/* vista inicial: fit del mundo */
function fitTodo(animar=false){
  const {width, height} = document.getElementById('lienzo').getBoundingClientRect();
  const k = Math.min(width/ANCHO_MUNDO, height/ALTO_MUNDO) * 0.96;
  const tx = (width - ANCHO_MUNDO*k)/2, ty = (height - ALTO_MUNDO*k)/2;
  const t = d3.zoomIdentity.translate(tx,ty).scale(k);
  (animar ? svg.transition().duration(900) : svg).call(zoom.transform, t);
}
function volarA(x, y, k=1.5){
  const {width, height} = document.getElementById('lienzo').getBoundingClientRect();
  const t = d3.zoomIdentity.translate(width/2 - x*k, height/2 - y*k).scale(k);
  svg.transition().duration(1400).call(zoom.transform, t);
}
/* menú de vistas */
document.querySelectorAll('#menu button[data-vista]').forEach(b => b.onclick = () => {
  const v = b.dataset.vista;
  if (v === 'todo') return fitTodo(true);
  const col = COLUMNAS.find(c => c.id === v);
  volarA(col.x0 + col.w/2, v === 'elena' ? añoY(2024) : Y0 + 1400, v === 'elena' ? 1.1 : 0.42);
});

let enfocado = null;
function enfocar(n){
  enfocado = n;
  document.body.classList.add('enfocado');
  document.querySelectorAll('.nodo').forEach(el => el.classList.remove('ego'));
  document.querySelectorAll('.arista,.arista-lbl').forEach(el => el.classList.remove('ego'));
  const vecinos = new Set([n.id]);
  for (const a of aristas){
    if (a.from === n.id || a.to === n.id){
      vecinos.add(a.from); vecinos.add(a.to);
      a._el.classed('ego', true);
      if (a._lbl) a._lbl.classed('ego', true);
    }
  }
  document.querySelectorAll('.nodo').forEach(el => {
    if (vecinos.has(el.dataset.id)) el.classList.add('ego');
  });
  abrirPanel(n);
}
function desenfocar(){
  enfocado = null;
  document.body.classList.remove('enfocado');
}
function abrirPanel(n){
  const p = document.getElementById('panel');
  p.querySelector('.p-numero').textContent = n.numero || '';
  p.querySelector('h3').textContent = n.titulo;
  p.querySelector('.p-meta').textContent =
    `${n.tipo} · ${n.año ?? 's/f'} · ${n.clase} / ${n.banda}` + (n.joya ? ' · 💎 joya' : '');
  p.querySelector('.p-resumen').textContent = n.resumen || '';
  const lista = p.querySelector('.p-lista');
  lista.innerHTML = '';
  for (const a of aristas){
    if (a.from !== n.id && a.to !== n.id) continue;
    const otro = porId.get(a.from === n.id ? a.to : a.from);
    const btn = document.createElement('button');
    btn.className = 'p-con';
    btn.innerHTML = `→ ${otro.titulo} <span class="rel">${a.label || a.tipo}</span>`;
    btn.onclick = () => { volarA(otro._x, otro._y, 1.6); enfocar(otro); };
    lista.appendChild(btn);
  }
  p.classList.add('abierto');
}
function cerrarPanel(){ document.getElementById('panel').classList.remove('abierto'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ cerrarPanel(); desenfocar(); } });

/* búsqueda */
document.getElementById('buscar').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const n = nodos.find(x => x.titulo.toLowerCase().includes(q));
  if (n){ volarA(n._x, n._y, 1.8); enfocar(n); }
});

/* ============ 7 · deep-link inicial ============ */
window.addEventListener('resize', () => actualizarChrome(d3.zoomTransform(svg.node())));
(function init(){
  const h = location.hash.slice(1);
  const nodoM = h.match(/^nodo=(.+)$/);
  if (nodoM && porId.get(nodoM[1])){
    fitTodo();
    const n = porId.get(nodoM[1]);
    setTimeout(() => { volarA(n._x, n._y, 1.7); enfocar(n); }, 350);
  } else if (/^-?[\d.]+,-?[\d.]+,[\d.]+$/.test(h)){
    const [x,y,k] = h.split(',').map(Number);
    svg.call(zoom.transform, d3.zoomIdentity.translate(x,y).scale(k));
  } else fitTodo();
})();
</script>
